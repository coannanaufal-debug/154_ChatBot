<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claude</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    <span>Chat Baru</span>
                </button>
            </div>
            <div class="sidebar-history" id="chatHistory">
                <div class="history-label">Terkini</div>
                <!-- Chat list dynamically populated -->
            </div>
            <div class="sidebar-footer">
                <div class="model-badge">
                    <span class="dot"></span>
                    <span>gemini-3.5-flash</span>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main">
            <!-- Top Bar -->
            <header class="topbar">
                <button class="icon-btn" id="toggleSidebar" title="Toggle Sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <line x1="9" y1="3" x2="9" y2="21"></line>
                    </svg>
                </button>
                <div class="topbar-title">Claude</div>
                <div class="topbar-spacer"></div>
            </header>

            <!-- Chat Area -->
            <div class="chat-container" id="chatContainer">
                <!-- Welcome View -->
                <div class="welcome-view" id="welcomeView">
                    <div class="claude-logo">
                        <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
                            <path d="M16 3C8.82 3 3 8.82 3 16s5.82 13 13 13 13-5.82 13-13S23.18 3 16 3zm0 2.4c5.85 0 10.6 4.75 10.6 10.6S21.85 26.6 16 26.6 5.4 21.85 5.4 16 10.15 5.4 16 5.4z" fill="#D97706"/>
                            <path d="M16 8a8 8 0 100 16 8 8 0 000-16z" fill="#D97706" opacity="0.3"/>
                            <circle cx="16" cy="16" r="4.5" fill="#B45309"/>
                        </svg>
                    </div>
                    <h1>Selamat datang kembali</h1>
                    <p class="subtitle">Ada yang bisa saya bantu hari ini?</p>

                    <div class="suggestion-grid">
                        <button class="suggestion-card" data-prompt="Jelaskan konsep dasar machine learning dengan analogi sederhana">
                            <span class="card-title">Jelaskan konsep</span>
                            <span class="card-desc">Machine learning dengan analogi sederhana</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Bantu saya menulis draft email formal untuk izin sakit ke dosen">
                            <span class="card-title">Tulis email formal</span>
                            <span class="card-desc">Izin sakit untuk dosen atau atasan</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Buatkan fungsi JavaScript untuk validasi nomor telepon Indonesia">
                            <span class="card-title">Tulis kode</span>
                            <span class="card-desc">Fungsi validasi nomor telepon di JS</span>
                        </button>
                        <button class="suggestion-card" data-prompt="Bagaimana cara kerja API REST dan apa bedanya dengan GraphQL?">
                            <span class="card-title">Bandingkan teknologi</span>
                            <span class="card-desc">REST API vs GraphQL</span>
                        </button>
                    </div>
                </div>

                <!-- Messages Stream -->
                <div class="messages" id="messagesList" style="display: none;"></div>
            </div>

            <!-- Input Bar -->
            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="messageInput" 
                        placeholder="Balas ke Claude..." 
                        rows="1"
                        autocomplete="off"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" disabled title="Kirim pesan">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                    </button>
                </div>
                <div class="input-footer">
                    Claude dapat membuat kesalahan. Harap verifikasi informasi penting.
                </div>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
